# fly.toml app configuration file generated for crdb-user-accounts on 2024-02-29T20:18:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'crdb-iam'
primary_region = 'fra'

[build]

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
