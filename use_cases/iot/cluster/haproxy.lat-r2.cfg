global
  maxconn 4096

# Re-resolve node names so a restarted node with a new IP is picked up again.
resolvers containerdns
    parse-resolv-conf
    hold valid 2s
    hold obsolete 2s

defaults
    mode                tcp
    timeout connect     10s
    timeout client      5m
    timeout server      5m
    option              clitcpka
    option              redispatch
    retries             3

# region_2 regional entrypoint -> lat-roach4, lat-roach5, lat-roach6
listen psql
    bind :26000
    mode tcp
    balance roundrobin
    option httpchk GET /health?ready=1
    server lat-roach4 lat-roach4:26257 check port 8080 inter 2s fall 2 rise 2 resolvers containerdns init-addr last,libc,none resolve-prefer ipv4
    server lat-roach5 lat-roach5:26257 check port 8080 inter 2s fall 2 rise 2 resolvers containerdns init-addr last,libc,none resolve-prefer ipv4
    server lat-roach6 lat-roach6:26257 check port 8080 inter 2s fall 2 rise 2 resolvers containerdns init-addr last,libc,none resolve-prefer ipv4

listen admin-ui
    bind :8080
    mode http
    balance roundrobin
    option httpchk GET /health
    timeout check 10s
    server lat-roach4 lat-roach4:8080 check inter 2s fall 2 rise 2 resolvers containerdns init-addr last,libc,none resolve-prefer ipv4
    server lat-roach5 lat-roach5:8080 check inter 2s fall 2 rise 2 resolvers containerdns init-addr last,libc,none resolve-prefer ipv4
    server lat-roach6 lat-roach6:8080 check inter 2s fall 2 rise 2 resolvers containerdns init-addr last,libc,none resolve-prefer ipv4

listen stats
    bind :8404
    mode http
    stats enable
    stats uri /
    stats refresh 10s
    stats admin if TRUE
