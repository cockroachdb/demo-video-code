<html>
  <head>
    <title>CockroachDB IoT example</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
		<script src="leaflet.rotatedMarker.js"></script>

    <script>
      const us_icon = L.icon({ iconUrl: "icon_us.png" });
			const eu_icon = L.icon({ iconUrl: "icon_eu.png" });
			const ap_icon = L.icon({ iconUrl: "icon_ap.png" });

      // Initialize the map and set its view to a dummy location
      var map = L.map("map").setView([0, 0], 3);

      // Set up the tiles for the map
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 10,
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);

      var markerGroup = L.layerGroup().addTo(map);

			function getIcon(region) {
				switch (region) {
					case 'aws-us-east-1':
						return us_icon
					case 'aws-ap-southeast-1':
						return ap_icon
					case 'aws-eu-central-1':
						return eu_icon
					default:
						console.log(`${region} is not a valid region`)
				}
			}

      function updateMapLocation() {
        fetch("http://localhost:3000")
          .then((response) => response.json())
          .then((data) => {
            markerGroup.clearLayers();

            data.forEach((item) => {
              const { lat, lon, region, heading } = item;
              var marker = L.marker([lat, lon], {
                icon: getIcon(region),
								rotationAngle: (heading + 270) % 360
              }).addTo(markerGroup);
            });
          })
          .catch((error) => console.log("Error:", error));
      }

      // Update the map location every second
      setInterval(updateMapLocation, 1000);
    </script>
  </body>
</html>
