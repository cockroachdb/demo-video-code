<html>
  <head>
    <title>CockroachDB IoT example</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="leaflet.rotatedMarker.js"></script>

    <script>
      const us_icon = L.icon({ iconUrl: "icon_us.png" });
      const eu_icon = L.icon({ iconUrl: "icon_eu.png" });
      const ap_icon = L.icon({ iconUrl: "icon_ap.png" });

      var map = L.map("map").setView([0, 0], 3);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 10,
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);

      var markerGroup = L.layerGroup().addTo(map);

      const regions = {
        "aws-us-east-1": "icon_us.png",
        "aws-ap-southeast-1": "icon_ap.png",
        "aws-eu-central-1": "icon_eu.png",
      };

      function updateMapLocation() {
        fetch("https://crdb-iot.fly.dev")
          // fetch("http://localhost:3000")
          .then((response) => response.json())
          .then((data) => {
            markerGroup.clearLayers();

            data.forEach((item) => {
              const { lat, lon, region, heading, last_update_latency_ms } =
                item;
              var marker = L.marker([lat, lon], {
                icon: L.divIcon({
                  className: "my-div-icon",
                  html: `<img src="${regions[region]}"/>
												 <span>${last_update_latency_ms}ms</span>`,
                }),
                rotationAngle: (heading + 270) % 360,
              }).addTo(markerGroup);
            });
          })
          .catch((error) => console.log("Error:", error));
      }

      setInterval(updateMapLocation, 1000);
    </script>
  </body>
</html>
